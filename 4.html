<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你不能同时拥有这些</title>
    <style>
        .a{
            display: flex;
            align-items: center;
        }

        
       
        
        .sw {
            -webkit-tap-highlight-color: transparent;
            appearance: none;
            -webkit-appearance: none;
            display: block;
            width: 51px;
            height: 31px;
            position: relative;
            background-color: #e9e9eb;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s ease-out;
            margin: 0;
        }
        
        .sw::after {
            content: "";
            position: absolute;
            top: 2px;
            left: 2px;
            width: 27px;
            height: 27px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0px 3px 8px rgba(0, 0, 0, 0.15), 0px 3px 1px rgba(0, 0, 0, 0.06);
            transition: all 0.2s ease-out;
        }
        
        .sw:checked {
          background-color: #34C759;
        }
        .sw:checked::after {
            transform: translateX(20px);
        }
        
    </style>
</head>
<body>
    <div class="a">
        <p>参加运动会</p>
        <input type="checkbox" class="sw" id="yun">
    </div>
    <div class="a">
        <p>学习</p>
        <input type="checkbox" class="sw" id="xue">
    </div>
    <div class="a">
        <p>回家</p>
        <input type="checkbox" class="sw" id="jia">
    </div>
    <script>
        const yun = document.getElementById('yun');
        const xue = document.getElementById('xue');
        const jia = document.getElementById('jia');
        yun.addEventListener('change',() => {
            if (yun.checked) {
                xue.checked = false;
                jia.checked = false;
            } else {
                jia.checked = true;
            }
        });
        xue.addEventListener('change',() => {
            if (xue.checked) {
                yun.checked = false;
                jia.checked = true;
            } else {
                
            }
        });
        jia.addEventListener('change',() => {
            if (jia.checked) {
                yun.checked = false;
                
            } else {
                yun.checked = true;
                xue.checked = false;
            }
        })

    </script>
</body>
</html>
